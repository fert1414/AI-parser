version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: ai_parser_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_db:/docker-entrypoint-initdb.d

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_parser_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  news_agent: 
    build: 
      context: ./backend 
      dockerfile: Dockerfile 
    container_name: ai_parser_news_service 
    restart: always 
    env_file: 
      - .env 
    depends_on: 
      - postgres 
      - qdrant 
    command: python -m app.main

volumes:
  postgres_data:
  qdrant_data: